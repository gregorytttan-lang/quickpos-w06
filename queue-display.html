<!-- Diagnostic bar: in DOM before script, always visible -->
<div id="diag-bar" style="position:fixed;top:0;left:0;right:0;z-index:999999;background:#1C1A08;color:#E8C547;font-size:12px;font-family:monospace;font-weight:bold;padding:7px 16px;border-bottom:1px solid #3A3010;white-space:nowrap;overflow:hidden">Loading...</div>

<script>
// ── Diagnostic helper ─────────────────────────────────────────────────────────
function diag(msg, bg) {
  var b = document.getElementById('diag-bar');
  if (!b) return;
  b.textContent = msg;
  if (bg) b.style.background = bg;
}
diag('JS running - Firebase loading...');

// ── Firebase config ───────────────────────────────────────────────────────────
var FB_CONFIG = {
  apiKey:            "AIzaSyAYKFXAcIAR6iJ29RkimJSy3vzka0gsdTs",
  authDomain:        "quickpos-w06.firebaseapp.com",
  databaseURL:       "https://quickpos-w06-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "quickpos-w06",
  storageBucket:     "quickpos-w06.firebasestorage.app",
  messagingSenderId: "1015464203400",
  appId:             "1:1015464203400:web:fe788848e3b0da2b403b3d"
};
var db;
try {
  firebase.initializeApp(FB_CONFIG);
  db = firebase.database();
  diag('Firebase OK - connecting to database...');
} catch(e) {
  diag('Firebase INIT ERROR: ' + e.message, '#7F1D1D');
}

// ── Constants ─────────────────────────────────────────────────────────────────
var SERVE_MS   = 60000;
var MISSED_MS  = 600000;
var MAX_ACTIVE = 4;
var MAX_MISSED = 2;
var RING_R     = 46;
var RING_C     = parseFloat((2 * Math.PI * RING_R).toFixed(2));

// ── State ─────────────────────────────────────────────────────────────────────
var entries      = {};
var announced    = {};
var dataReceived = false;

// ── Clock ─────────────────────────────────────────────────────────────────────
var DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function updateClock() {
  var n = new Date();
  var h = String(n.getHours()).padStart(2,'0');
  var m = String(n.getMinutes()).padStart(2,'0');
  var clk = document.getElementById('clock');
  var dat = document.getElementById('clock-date');
  if (clk) clk.textContent = h + ':' + m;
  if (dat) dat.textContent = DAYS[n.getDay()] + '  ' + n.getDate() + ' ' + MONTHS[n.getMonth()] + ' ' + n.getFullYear();
}
setInterval(updateClock, 1000);
updateClock();

// ── Wake Lock ─────────────────────────────────────────────────────────────────
function reqWakeLock() {
  if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(function(){});
}
reqWakeLock();
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'visible') reqWakeLock();
});

// ── Connection dot ────────────────────────────────────────────────────────────
if (db) {
  db.ref('.info/connected').on('value', function(snap) {
    var dot = document.getElementById('conn-dot');
    var ok  = snap.val();
    if (dot) {
      dot.style.background = ok ? '#16A34A' : '#DC2626';
      dot.style.boxShadow  = ok ? '0 0 5px #16A34A' : '0 0 5px #DC2626';
    }
    if (!dataReceived) {
      diag(ok ? 'Firebase CONNECTED - tap Call Customer on KDS to test' : 'Firebase DISCONNECTED - check WiFi', ok ? '#0A200A' : '#7F1D1D');
    }
  });
}

// ── TTS ───────────────────────────────────────────────────────────────────────
function speakNumber(queueNo, times) {
  if (!window.speechSynthesis) return;
  times = times || 3;
  var text = 'Number ' + parseInt(queueNo) + ', please come to the counter';
  var count = 0;
  function go() {
    if (count >= times) return;
    count++;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-SG'; u.rate = 0.84; u.pitch = 0.9; u.volume = 1;
    var vs = window.speechSynthesis.getVoices();
    var v = null;
    for (var i = 0; i < vs.length; i++) {
      if (vs[i].lang === 'en-SG' || vs[i].lang === 'en-IN') { v = vs[i]; break; }
    }
    if (!v) for (var i = 0; i < vs.length; i++) {
      if (vs[i].lang.indexOf('en') === 0) { v = vs[i]; break; }
    }
    if (v) u.voice = v;
    u.onend  = function() { if (count < times) setTimeout(go, 2800); };
    u.onerror = function() { if (count < times) setTimeout(go, 2800); };
    window.speechSynthesis.speak(u);
  }
  setTimeout(go, 400);
}
setInterval(function() {
  if (window.speechSynthesis && !window.speechSynthesis.speaking) window.speechSynthesis.resume();
}, 5000);

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmtQ(n) { return String(n).padStart(3,'0'); }

function getActive() {
  return Object.entries(entries)
    .filter(function(kv) { return kv[1].status === 'serving'; })
    .sort(function(a,b) { return b[1].calledAt - a[1].calledAt; })
    .slice(0, MAX_ACTIVE);
}
function getMissed() {
  return Object.entries(entries)
    .filter(function(kv) { return kv[1].status === 'missed'; })
    .sort(function(a,b) { return b[1].calledAt - a[1].calledAt; })
    .slice(0, MAX_MISSED);
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderDisplay() {
  var now    = Date.now();
  var active = getActive();
  var missed = getMissed();
  var total  = Object.keys(entries).length;
  var sl     = Object.values(entries).map(function(e){return e.status;}).join(',') || 'none';
  diag('FB:' + (dataReceived?'OK':'wait') + ' entries=' + total + '[' + sl + '] serving=' + active.length + ' missed=' + missed.length);

  var grid = document.getElementById('serving-grid');
  if (!grid) return;

  if (!active.length) {
    grid.innerHTML = '<div class="empty-state"><div class="empty-icon">&#x1F37D;&#xFE0F;</div>'
      + '<div class="empty-txt">' + (dataReceived ? 'Waiting for orders' : 'Connecting...') + '</div></div>';
  } else {
    var html = '';
    for (var i = 0; i < MAX_ACTIVE; i++) {
      if (i < active.length) {
        var id = active[i][0]; var e = active[i][1];
        var elapsed = Math.max(0, Math.floor((now - e.calledAt) / 1000));
        var remain  = Math.max(0, 60 - elapsed);
        var offset  = Math.min(RING_C, (elapsed / 60) * RING_C).toFixed(2);
        var urgent  = remain <= 15;
        var sc      = urgent ? '#DC2626' : '#E8C547';
        html += '<div class="s-card active" data-id="' + id + '">'
              + '<div class="card-radial"></div><div class="q-hash">#</div>'
              + '<div class="q-num">' + fmtQ(e.queueNo) + '</div>'
              + '<div class="ring-wrap"><svg viewBox="0 0 100 100" width="82" height="82">'
              + '<circle cx="50" cy="50" r="' + RING_R + '" fill="none" stroke="#1C1408" stroke-width="7"/>'
              + '<circle class="ring-arc" cx="50" cy="50" r="' + RING_R + '" fill="none" stroke="' + sc + '" stroke-width="7"'
              + ' stroke-dasharray="' + RING_C + '" stroke-dashoffset="' + offset + '"'
              + ' stroke-linecap="round" transform="rotate(-90 50 50)"/></svg>'
              + '<div class="ring-secs' + (urgent ? ' urgent' : '') + '">' + remain + '</div>'
              + '</div></div>';
      } else {
        html += '<div class="s-card empty"><div class="q-num">-</div></div>';
      }
    }
    grid.innerHTML = html;
  }

  var chipsEl = document.getElementById('missed-chips');
  if (chipsEl) {
    if (!missed.length) {
      chipsEl.innerHTML = '<div class="no-missed">-- No missed numbers --</div>';
    } else {
      chipsEl.innerHTML = missed.map(function(kv) {
        var id = kv[0]; var e = kv[1];
        var age  = Math.max(0, now - e.calledAt);
        var mins = Math.floor(age/60000); var secs = Math.floor((age%60000)/1000);
        return '<div class="m-chip" data-id="' + id + '"><div><div class="m-hash">#</div>'
             + '<div class="m-num">' + fmtQ(e.queueNo) + '</div></div>'
             + '<div class="m-time">Called<br>' + (mins>0?mins+'m '+secs+'s':secs+'s') + ' ago</div></div>';
      }).join('');
    }
  }
}

// ── Tick ──────────────────────────────────────────────────────────────────────
function tick() {
  var now = Date.now(); var changed = false;
  Object.keys(entries).forEach(function(id) {
    var e = entries[id]; var age = now - e.calledAt;
    if (e.status === 'serving' && age >= SERVE_MS) {
      if (db) db.ref('queue_display').child(id).update({status:'missed'});
      entries[id].status = 'missed'; changed = true;
    } else if (e.status === 'missed' && age >= MISSED_MS) {
      if (db) db.ref('queue_display').child(id).remove();
      delete entries[id]; changed = true;
    }
  });
  if (changed) { renderDisplay(); return; }

  document.querySelectorAll('.s-card.active').forEach(function(card) {
    var id=card.dataset.id; var e=entries[id]; if (!e) return;
    var elapsed=Math.max(0,Math.floor((Date.now()-e.calledAt)/1000));
    var remain=Math.max(0,60-elapsed);
    var offset=Math.min(RING_C,(elapsed/60)*RING_C).toFixed(2);
    var urgent=remain<=15;
    var arc=card.querySelector('.ring-arc');
    if (arc){arc.setAttribute('stroke-dashoffset',offset);arc.setAttribute('stroke',urgent?'#DC2626':'#E8C547');}
    var sec=card.querySelector('.ring-secs');
    if (sec){sec.textContent=remain;sec.className='ring-secs'+(urgent?' urgent':'');}
  });
  document.querySelectorAll('.m-chip').forEach(function(chip) {
    var id=chip.dataset.id; var e=entries[id]; if (!e) return;
    var age=Math.max(0,Date.now()-e.calledAt);
    var mins=Math.floor(age/60000); var secs=Math.floor((age%60000)/1000);
    var t=chip.querySelector('.m-time');
    if (t) t.innerHTML='Called<br>'+(mins>0?mins+'m '+secs+'s':secs+'s')+' ago';
  });
}
setInterval(tick, 1000);

// ── Firebase listener ─────────────────────────────────────────────────────────
if (db) {
  db.ref('queue_display').on('value', function(snap) {
    dataReceived = true;
    var data = snap.val() || {};
    Object.keys(data).forEach(function(id) {
      var e = data[id]; var key = id + '_' + e.calledAt;
      if (e.status === 'serving' && !announced[key]) {
        announced[key] = true;
        speakNumber(e.queueNo, 3);
      }
    });
    entries = data;
    renderDisplay();
  }, function(err) {
    diag('READ ERROR: ' + err.code + ' -- Firebase Console > Realtime Database > Rules -- add: "queue_display":{".read":true,".write":true}', '#7F1D1D');
  });
}
</script>
